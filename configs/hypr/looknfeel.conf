# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    border_size = 1

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Opacity is 0.0-1.0; 1.0 is fully opaque. Values above 1.0 are out of range
    # and cost the opaque-window fast path, which direct scanout depends on.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

# https://wiki.hyprland.org/Configuring/Variables/#render
render {
    # Hand a fullscreen opaque window's buffer straight to the display
    # controller instead of compositing it, saving a copy and a frame of
    # latency. Blur and non-1.0 opacity both disqualify a window from this.
    direct_scanout = 1
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

