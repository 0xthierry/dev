# Voxtype compositor integration
# Fixes terminal input when the Super+Shift dictation shortcut modifiers are
# still physically held as Voxtype emits synthetic text.
#
# Voxtype enters these submaps via [output] hooks in configs/voxtype/config.toml.
# F12 cancels/resets if anything gets stuck.

submap = voxtype_recording
# Keep the same toggle shortcut available while the recording submap is active.
bindr = SUPER SHIFT, V, exec, bash -lc 'sleep 0.3; voxtype record toggle'
bind = , F12, exec, voxtype record cancel
bind = , F12, submap, reset
submap = reset

submap = voxtype_suppress
bind = , SUPER_L, exec, true
bind = , SUPER_R, exec, true
bind = , Control_L, exec, true
bind = , Control_R, exec, true
bind = , Alt_L, exec, true
bind = , Alt_R, exec, true
bind = , Shift_L, exec, true
bind = , Shift_R, exec, true
bind = , F12, submap, reset
submap = reset
