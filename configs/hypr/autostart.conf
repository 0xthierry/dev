# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Keep Xwayland apps aligned with the Hyprland US International keyboard layout.
exec-once = bash -c 'for _ in {1..20}; do setxkbmap -layout us -model pc105 -variant intl -option compose:caps && exit 0; sleep 0.5; done'

# Waybar watchdog: relaunches waybar if it crashes (known SIGABRT on Logitech
# Bolt receiver sleep — device removal event triggers uncaught exception)
exec-once = bash -c 'while true; do sleep 5; pgrep -x waybar >/dev/null || uwsm-app -- waybar; done'
