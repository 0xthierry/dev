# Application bindings

# macOS-style copy/paste on the Command/Super key. Omarchy's default sends
# Ctrl+Insert / Shift+Insert, which is unreliable in regular GUI apps.
unbind = SUPER, C
unbind = SUPER, V
unbind = SUPER, X
bindr = SUPER, C, exec, bash ~/.config/hypr/scripts/clipboard-shortcut copy
bindr = SUPER, V, exec, bash ~/.config/hypr/scripts/clipboard-shortcut paste
bindr = SUPER, X, exec, bash ~/.config/hypr/scripts/clipboard-shortcut cut

bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"
# bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden.desktop

# Replace Omarchy's Voxtype shortcuts with Handy on Super+Shift+V.
# Trigger on key release and wait briefly so Handy pastes after the modifiers are released.
unbind = SUPER CTRL, X
unbind = , F9
bindr = SUPER SHIFT, V, exec, bash -lc 'sleep 0.3; handy --toggle-transcription'
bindd = , F9, Start Handy dictation (push-to-talk), exec, handy --toggle-transcription
binddr = , F9, Stop Handy dictation (push-to-talk), exec, handy --toggle-transcription

# Launch the native AI desktop apps on workspace 5.
bindd = SUPER SHIFT, A, ChatGPT, exec, bash -lc 'hyprctl dispatch workspace 5; omarchy-launch-or-focus ChatGPT "uwsm-app -- chatgpt"'
bindd = SUPER SHIFT, C, Claude, exec, bash -lc 'hyprctl dispatch workspace 5; omarchy-launch-or-focus anthropic "uwsm-app -- claude-desktop"'
bindd = SUPER SHIFT, G, Github, exec, omarchy-launch-webapp "https://github.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.google.com/mail/u/0/#inbox"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Steam / Gamescope Launcher

# Gaming Mode bindings - added by installation script
bindd = SUPER SHIFT, S, Steam Gaming Mode, exec, /home/thierry/.local/share/steam-launcher/enter-gamesmode
bindd = SUPER SHIFT, R, Exit Gaming Mode, exec, /home/thierry/.local/share/steam-launcher/leave-gamesmode
# End Gaming Mode bindings

# Unbind the old PRINT key commands to avoid any conflicts
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = CTRL, PRINT
unbind = ALT, PRINT
unbind = CTRL ALT, PRINT
unbind = SUPER, PRINT

# Screenshots and Recordings with SUPER + the physical GRAVE (`) key.
# US International makes this key a dead_grave/dead_tilde keysym, so bind by XKB keycode.
bindd = SUPER, code:49, Screenshot of region, exec, omarchy capture screenshot region
bindd = SUPER SHIFT, code:49, Screenshot of window, exec, omarchy capture screenshot windows
bindd = SUPER CTRL, code:49, Screenshot of display, exec, omarchy capture screenshot fullscreen
bindd = SUPER ALT, code:49, Screen record a region, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenrecord
bindd = SUPER CTRL ALT, code:49, Screen record display, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenrecord output
