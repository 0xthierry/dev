# Voxtype compositor integration
# Fixes modifier key interference when using Super+Ctrl+X.
#
# voxtype_recording is unused. Switching into it on record-start ate F9
# release, so dictation never stopped.
# voxtype_suppress is active during text output and blocks leftover modifiers.
#
# Do not bind Escape in voxtype_suppress. Binding Escape drops wtype's first
# character. See: https://github.com/hyprwm/Hyprland/issues/3165

submap = voxtype_recording
bind = , F12, exec, voxtype record cancel
bind = , F12, submap, reset
submap = reset

submap = voxtype_suppress
bind = , SUPER_L, exec, true
bind = , SUPER_R, exec, true
bind = , Control_L, exec, true
bind = , Control_R, exec, true
bind = , Alt_L, exec, true
bind = , Alt_R, exec, true
bind = , Shift_L, exec, true
bind = , Shift_R, exec, true
bind = CTRL, X, exec, true
bind = SUPER, X, exec, true
bind = SUPER CTRL, X, exec, true
bind = SUPER ALT, X, exec, true
bind = , F12, submap, reset
submap = reset
