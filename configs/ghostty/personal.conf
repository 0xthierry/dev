# Deliberate clipboard policy (a808998 and f10a7f5); trusted terminal workflows.
clipboard-read = allow
clipboard-write = allow
clipboard-paste-protection = false

# Personal split navigation; keep stock Shift+Enter and Alt+Shift+Enter CSI-u.
keybind = ctrl+shift+alt+h=goto_split:left
keybind = ctrl+shift+alt+j=goto_split:down
keybind = ctrl+shift+alt+k=goto_split:up
keybind = ctrl+shift+alt+l=goto_split:right
