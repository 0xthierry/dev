model = "gpt-6-astra"
model_provider = "cliproxyapi"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
model_verbosity = "medium"
personality = "pragmatic"
developer_instructions = """
{{DEVELOPER_INSTRUCTIONS}}
"""
plan_mode_reasoning_effort = "high"
hide_agent_reasoning = false
show_raw_agent_reasoning = true
notify = ["notify-send", "Codex"]
web_search = "live"
file_opener = "none"
project_doc_max_bytes = 65536
suppress_unstable_features_warning = true

# Local Codex account pool; use -c 'model_provider="openai"' for direct access.
[model_providers.cliproxyapi]
name = "CLIProxyAPI (local Codex account pool)"
base_url = "http://127.0.0.1:8317/v1"
wire_api = "responses"
supports_websockets = false
request_max_retries = 1
stream_max_retries = 1

[model_providers.cliproxyapi.auth]
command = "/bin/sh"
args = ["-c", "cat \"$HOME/.config/cliproxyapi/api-key\""]

[history]
max_bytes = 1073741824
persistence = "save-all"

[features]
multi_agent = true
hooks = true

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 1800

[tui]
alternate_screen = "never"
animations = false
show_tooltips = false
status_line = ["model-with-reasoning", "context-remaining", "used-tokens", "current-dir", "git-branch", "five-hour-limit"]
terminal_title = ["project", "spinner", "status", "git-branch", "model"]

[tools.web_search]
context_size = "high"

[shell_environment_policy]
inherit = "all"

[memories]
no_memories_if_mcp_or_web_search = true
min_rollout_idle_hours = 24
