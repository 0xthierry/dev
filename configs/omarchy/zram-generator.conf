[zram0]
# zram-size is an arithmetic expression evaluated in MEGABYTES (fasteval DSL).
# Suffixes are scientific notation, not binary units -- "16G" parses as 16e9,
# i.e. 16 billion megabytes, and the kernel rejects the resulting 65TB metadata
# table with ENOMEM. Always use a plain megabyte count here.
zram-size = 16384
compression-algorithm = zstd
swap-priority = 100
