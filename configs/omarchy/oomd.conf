[OOM]
# zram fills as a normal consequence of operation, not as a distress signal:
# a high vm.swappiness pushes cold anonymous pages there while RAM is still
# plentiful. Because SwapUsedLimit measures swap-device utilisation, a low
# value makes oomd kill healthy processes on a machine with tens of GiB free.
# Keep this near-exhaustion; memory pressure below is the signal that actually
# tracks trouble.
SwapUsedLimit=95%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
