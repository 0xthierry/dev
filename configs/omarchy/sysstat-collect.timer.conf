[Timer]
# Ten-minute samples are too coarse for short resource-collapse incidents, but
# per-minute sampling costs 1440 wakeups and writes a day -- each one a
# copy-on-write metadata update, duplicated (DUP metadata), compressed and
# encrypted. Five minutes keeps enough resolution to spot an incident at a
# fifth of the churn.
OnCalendar=
OnCalendar=*-*-* *:0/5:00
AccuracySec=5s
RandomizedDelaySec=0
