[Slice]
# Keep container workloads from starving the desktop and host services.
# docker.service remains outside this slice. CPU and TasksMax stay unconstrained;
# memory is the desktop-protection boundary, not a container throughput quota.
MemoryHigh=24G
MemoryMax=32G
MemorySwapMax=8G
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
