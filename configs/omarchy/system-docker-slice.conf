[Slice]
# Keep container workloads from starving the desktop and host services.
# All containers in this slice share 16 CPUs' worth of time; dockerd is outside it.
CPUQuota=1600%
MemoryHigh=24G
MemoryMax=32G
MemorySwapMax=8G
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
