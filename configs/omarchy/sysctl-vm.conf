# Swap lives on zram (see zram-generator.conf), where a page-out costs a few
# microseconds of compression rather than a disk round trip. The default
# swappiness of 60 is tuned for swapping to a disk and leaves zram idle.
#
# Pairs with SwapUsedLimit=95% in oomd.conf: a high swappiness fills zram as
# normal operation, so a low oomd swap limit would kill healthy processes.
# Raise these two together or not at all.
vm.swappiness = 180

# zram compresses in ~4K chunks, so reading ahead on swap-in wastes work.
vm.page-cluster = 0
