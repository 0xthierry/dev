# Interactive build profile. makepkg reads this after /etc/makepkg.conf and
# before user-specific overrides. Do not rewrite custom jobserver/other flags.
if [[ -z ${MAKEFLAGS:-} || $MAKEFLAGS =~ ^-j[0-9]+$ ]]; then
  _dev_setup_jobs=$(nproc)
  case ${DEV_MAKEPKG_JOBS:-8} in
    8|12|16) _dev_setup_limit=${DEV_MAKEPKG_JOBS:-8} ;;
    *) _dev_setup_limit=8; printf 'Ignoring unsupported DEV_MAKEPKG_JOBS; choose 8, 12 or 16.\n' >&2 ;;
  esac
  (( _dev_setup_jobs <= _dev_setup_limit )) || _dev_setup_jobs=$_dev_setup_limit
  MAKEFLAGS="-j${_dev_setup_jobs}"
  # Only replace the distribution's exact all-threads compressor, not a
  # user-supplied compression level, wrapper or option sequence.
  if [[ ${COMPRESSZST[*]:-} == 'zstd -c -T0 -' ]]; then
    COMPRESSZST=(zstd -c "-T${_dev_setup_jobs}" -)
  fi
  unset _dev_setup_jobs _dev_setup_limit
fi
