[Journal]
# journald defaults to 10% of the filesystem, which on a 3.6TB root means an
# effectively unbounded journal -- it had grown to 3.9G across 135 boots before
# this cap. Every write also passes through btrfs CoW, DUP metadata,
# compression and dm-crypt, so an uncapped journal is steady write load too.
SystemMaxUse=500M
SystemMaxFileSize=50M
