# Voxtype Configuration
# Managed by this repo; deployed to ~/.config/voxtype/config.toml on omarchy.
# Omarchy's Hyprland defaults bind Super+Ctrl+X to `voxtype record toggle`
# and F9 to push-to-talk. This config disables Voxtype's evdev hotkey
# listener and lets Hyprland drive it.

# Required for `voxtype record toggle` and `voxtype status`.
state_file = "auto"

# Best English accuracy with built-in punctuation/capitalization.
# Requires an ONNX-enabled Voxtype binary and the Parakeet model.
engine = "parakeet"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = true

[parakeet]
# Full-precision TDT model: best English accuracy, punctuation, and capitalization.
# Smaller/faster alternative: "parakeet-tdt-0.6b-v3-int8".
model = "parakeet-tdt-0.6b-v3"
model_type = "tdt"
# Keep loaded for low-latency dictation. Set true if RAM/battery matters more.
on_demand_loading = false

[output]
# Paste one chord instead of typing each letter. wtype outside a text field
# fires Hyprland/app shortcuts (the "sending commands" bug).
mode = "paste"
paste_keys = "shift+insert"
fallback_to_clipboard = true
restore_clipboard = false
# Wait until Super/Ctrl are actually up so leftover Ctrl+X cannot cut.
wait_for_modifier_release = true
modifier_release_timeout_ms = 750
pre_type_delay_ms = 250
# Suppress leftover modifiers while pasting. Do not enter a recording submap
# or F9/Super+Ctrl+X will stop working.
pre_output_command = "hyprctl dispatch submap voxtype_suppress"
post_output_command = "hyprctl dispatch submap reset"
type_delay_ms = 1

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = true

[output.post_process]
# Local gemma3:4b cleanup: grammar, punctuation, filler removal.
# On timeout or error, Voxtype types the raw Parakeet transcript.
command = "voxtype-post-process"
timeout_ms = 15000

[text]
# Deterministic spelling fixes. Extend this table in the repo, not in Gemma.
# replacements = { "oh marky" = "Omarchy", "hyper land" = "Hyprland" }

[status]
icon_theme = "omarchy"
